include:
    -  proxy.yaml

services:
    web:
      image: cr.yandex/crp6gqsirr810ecksgm1/mult_py:latest
      restart: always
      networks:
        backend:
          ipv4_address: 172.20.0.5
      environment:
        DB_HOST: db
        DB_NAME: ${MYSQL_DATABASE}
        DB_USER: ${MYSQL_USER}
        DB_PASSWORD: ${MYSQL_PASSWORD}

    db:
      image: mysql:8
      command: --mysql-native-password=ON --authentication-policy=mysql_native_password
      restart: always
      networks:
        backend:
          ipv4_address: 172.20.0.10
      env_file:
        - .env